<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIZAN MOD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Share+Tech+Mono&amp;display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #bg-site {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
            background: #0a0800;
        }

        #bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: rgba(0, 0, 0, 0.1);
            pointer-events: none;
        }

        :root {
            --g1: #c59327;
            --g2: #ffd700;
            --g3: #ffeb73;
            --s1: #a0a0a0;
            --s2: #ffffff;
            --bg-dark: #000000;
            --bg-panel: #0a0800;
        }

        @keyframes sf { 0%, 100% { transform: translateY(0) rotate(-2deg) } 50% { transform: translateY(-5px) rotate(2deg) } }
        @keyframes ss { to { transform: rotate(360deg) } }
        @keyframes ssr { to { transform: rotate(-360deg) } }
        @keyframes sp { 0%, 100% { transform: scale(0.86); opacity: 0.7 } 50% { transform: scale(1.15); opacity: 1 } }
        @keyframes sa { 0%, 100% { transform: scale(0.96) rotate(-1deg) } 50% { transform: scale(1.05) rotate(1deg) } }
        @keyframes sdash { to { stroke-dashoffset: -120 } }
        @keyframes ssh { 0% { left: -120%; opacity: 0 } 30% { opacity: 0.78 } 100% { left: 135%; opacity: 0 } }
        @keyframes sl { 0%, 100% { transform: translateX(0) rotate(7deg) scaleX(0.88) } 50% { transform: translateX(17px) rotate(-8deg) scaleX(1.12) } }
        @keyframes sr { 0%, 100% { transform: translateX(0) rotate(-7deg) scaleX(0.88) } 50% { transform: translateX(-17px) rotate(8deg) scaleX(1.12) } }
        @keyframes imgPulse { 0%, 100% { transform: scale(0.95) } 50% { transform: scale(1.07) } }
        @keyframes spdFadeIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes spdFadeOut { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.9); } }
        @keyframes sflow { 0% { background-position: 0% 50% } 50% { background-position: 100% 50% } 100% { background-position: 0% 50% } }
        @keyframes spop { 0% { transform: scale(0.5); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }

        #mini {
            position: fixed;
            right: 16px;
            top: 50%;
            width: 52px;
            height: 52px;
            cursor: grab;
            touch-action: none;
            z-index: 999999;
            will-change: left, top;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #spd-fab-core {
            width: 52px; height: 52px; border-radius: 50%; position: relative;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at 35% 25%, rgba(255,255,255,0.3), transparent 18%), radial-gradient(circle, #2b2000, var(--bg-dark) 72%);
            border: 2px solid var(--g2);
            box-shadow: 0 0 16px rgba(255, 215, 0, 0.9), inset 0 0 14px rgba(255, 215, 0, 0.6);
            overflow: hidden; animation: sf 3s ease-in-out infinite;
        }
        #spd-fab-core:before { content: ''; position: absolute; inset: -8px; border-radius: 50%; background: conic-gradient(transparent, var(--g1), transparent, var(--g3), transparent); animation: ss 2.8s linear infinite; }
        #spd-fab-core:after { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: var(--bg-dark); z-index: 1; }
        #spd-fab-icon { position: relative; z-index: 3; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; animation: sa 1.5s ease-in-out infinite; }
        #spd-fab-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; filter: drop-shadow(0 0 10px var(--g2)) hue-rotate(0deg) saturate(1.5); }
        #spd-fab-dot { position: absolute; right: -2px; top: -2px; width: 12px; height: 12px; border-radius: 50%; background: var(--g2); box-shadow: 0 0 12px var(--g2); z-index: 5; animation: sp 1.1s infinite; }

        #stage {
            display: none;
            position: fixed;
            left: calc(50% - 115px);
            top: calc(50% - 160px);
            width: 230px;
            height: 320px;
            z-index: 999999;
            touch-action: none;
            cursor: grab;
            will-change: left, top, opacity;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #stage.spd-open { display: block; animation: spdFadeIn 0.35s ease-out forwards; }
        #stage.spd-close { animation: spdFadeOut 0.25s ease-in forwards; pointer-events: none; }

        .spd-websvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8)); }
        .d1 { stroke-dasharray: 11 8; animation: sdash 4s linear infinite; }
        .d2 { stroke-dasharray: 7 10; animation: sdash 5.5s linear infinite reverse; }

        .spd-tent { position: absolute; width: 70px; height: 9px; border-radius: 50px; background: linear-gradient(90deg, transparent, var(--g1), var(--g2), var(--g1), transparent); box-shadow: 0 0 12px var(--g2); z-index: 2; opacity: 0.95; }
        .spd-tent:before, .spd-tent:after { content: ''; position: absolute; width: 11px; height: 11px; border-radius: 50%; top: -1px; background: radial-gradient(circle, #ffffff, var(--g2) 60%, #1a1400); box-shadow: 0 0 12px var(--g2); }
        .spd-tent:before { left: 14px } .spd-tent:after { right: 14px }
        .t1 { left: -40px; top: 65px; animation: sl 2.1s ease-in-out infinite; }
        .t2 { left: -48px; top: 145px; animation: sl 2.35s ease-in-out infinite 0.2s; }
        .t3 { left: -40px; bottom: 58px; animation: sl 2.2s ease-in-out infinite 0.35s; }
        .t4 { right: -40px; top: 75px; animation: sr 2.15s ease-in-out infinite 0.15s; }
        .t5 { right: -48px; top: 162px; animation: sr 2.4s ease-in-out infinite 0.3s; }
        .t6 { right: -40px; bottom: 52px; animation: sr 2.15s ease-in-out infinite 0.45s; }

        .liquid-border-wrap {
            position: absolute; inset: 18px 11px 11px; 
            border-radius: 28px; 
            padding: 4px; 
            background: var(--bg-dark); 
            overflow: hidden; 
            box-shadow: 0 0 24px rgba(255, 215, 0, 0.8);
        }

        .liquid-border-wrap::before {
            content: ''; position: absolute; 
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(
                transparent 10%, var(--g2) 20%, var(--s2) 25%, var(--g1) 30%, 
                transparent 50%, var(--s1) 70%, var(--g3) 75%, var(--g1) 80%, transparent 90%
            );
            animation: ss 3s linear infinite;
        }

        .spd-panel { 
            position: relative; width: 100%; height: 100%; 
            border-radius: 24px; 
            background: var(--bg-panel); 
            z-index: 2; padding: 12px; overflow: hidden; 
        }

        .spider-web {
            position: absolute; inset: 0; z-index: -2; pointer-events: none;
            background: 
                repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 18px, rgba(255, 215, 0, 0.45) 19px, transparent 20px),
                repeating-conic-gradient(from 0deg at 50% 50%, rgba(255, 215, 0, 0.4) 0deg, transparent 1deg, transparent 29deg, rgba(255, 215, 0, 0.4) 30deg);
            opacity: 1; 
        }

        .scan-area {
            position: absolute;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 50%, rgba(255, 215, 0, 0.5) 85%, rgba(255, 215, 0, 0.9) 100%);
            z-index: -1; pointer-events: none;
            mix-blend-mode: screen; 
        }
        .scan-1 { top: -100px; left: -100px; width: 280px; height: 280px; animation: ss 4s linear infinite; }
        .scan-2 { bottom: -80px; right: -80px; width: 250px; height: 250px; animation: ssr 5s linear infinite; }
        .scan-3 { top: 20%; left: -150px; width: 450px; height: 450px; animation: ss 7s linear infinite; }

        .spd-panel:after { content: ''; position: absolute; top: 0; left: -120%; width: 78%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent); animation: ssh 4.2s linear infinite; pointer-events: none; }

        .spd-head { position: relative; z-index: 5; display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
        .spd-title { 
            font-family: 'Orbitron', sans-serif !important; 
            font-weight: 900; 
            font-size: 14px; 
            letter-spacing: 1px; 
            background: linear-gradient(to bottom, var(--s2), var(--g2)); 
            -webkit-background-clip: text; 
            color: transparent; 
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6); 
            white-space: nowrap; 
        }
        .spd-live { font-family: 'Share Tech Mono', monospace; font-size: 7px; color: var(--bg-dark); border: 1px solid var(--g2); border-radius: 999px; padding: 2px 6px; background: var(--g2); box-shadow: 0 0 12px var(--g2); font-weight: 900;}

        #spd-period { position: relative; z-index: 6; height: 18px; margin-bottom: 7px; border-radius: 10px; border: 1px solid var(--g2); background: rgba(0, 0, 0, 0.95); display: flex; align-items: center; justify-content: center; font-family: 'Share Tech Mono', monospace; font-size: 8px; color: var(--g3); letter-spacing: 0.8px; text-shadow: 0 0 8px var(--g2); transition: all 0.2s; }

        #spd-screen { position: relative; z-index: 5; height: 165px; border-radius: 18px; border: 1.5px solid rgba(255, 215, 0, 0.7); background: radial-gradient(circle at 50% 35%, rgba(255, 215, 0, 0.18), transparent 45%), linear-gradient(180deg, rgba(20, 16, 0, 0.95), #000); box-shadow: inset 0 0 18px rgba(255, 215, 0, 0.35), 0 0 12px rgba(0, 0, 0, 0.9); overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #spd-screen:before { content: ''; position: absolute; inset: 0; opacity: 0.25; background: repeating-radial-gradient(circle at 50% 50%, transparent 0 14px, rgba(255, 215, 0, 0.45) 15px, transparent 16px); animation: ss 20s linear infinite; }

        .spd-c { position: absolute; width: 18px; height: 18px; z-index: 4; }
        .spd-c:before, .spd-c:after { content: ''; position: absolute; background: var(--g2); box-shadow: 0 0 10px var(--g2); }
        .spd-c:before { width: 18px; height: 2px } .spd-c:after { width: 2px; height: 18px }
        .c1 { top: 9px; left: 9px } .c1:before, .c1:after { top: 0; left: 0 }
        .c2 { top: 9px; right: 9px } .c2:before, .c2:after { top: 0; right: 0 }
        .c3 { bottom: 9px; left: 9px } .c3:before, .c3:after { bottom: 0; left: 0 }
        .c4 { bottom: 9px; right: 9px } .c4:before, .c4:after { bottom: 0; right: 0 }

        #spd-ui { position: relative; z-index: 8; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

        .box { text-align: center; padding: 8px; width: 100%; }
        .mark { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 7px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.3), transparent 18%), radial-gradient(circle, var(--g1), #1a1400 65%, #000); border: 1.6px solid var(--g2); box-shadow: 0 0 18px rgba(255, 215, 0, 0.7), inset 0 0 16px rgba(0, 0, 0, 0.9); animation: sa 1.55s ease-in-out infinite; overflow: hidden; }
        .mark-img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; filter: drop-shadow(0 0 10px var(--g2)); animation: imgPulse 1.2s ease-in-out infinite; }
        .btitle { font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 900; background: linear-gradient(to bottom, var(--s2), var(--s1)); -webkit-background-clip: text; color: transparent; letter-spacing: 0.9px; line-height: 1; text-transform: uppercase; filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.5)); }
        .bsub { font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 900; color: var(--g2); margin-top: 5px; line-height: 1; text-shadow: 0 0 10px var(--g2); }
        .bnote { font-family: 'Share Tech Mono', monospace; font-size: 7px; color: #fff; margin-top: 6px; letter-spacing: 0.5px; line-height: 1.3; text-shadow: 0 0 5px rgba(255, 255, 0, 0.5); }

        .spd-loader { text-align: center; width: 100%; }
        .spd-spinner { position: relative; width: 75px; height: 75px; margin: 0 auto 7px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .ring { position: absolute; border-radius: 50%; border: 2.5px solid transparent; }
        .r1 { inset: 0; border-top-color: rgba(255, 255, 255, 0.95); border-right-color: var(--g2); box-shadow: 0 0 10px var(--g2); animation: ss 0.9s linear infinite; }
        .r2 { inset: 11px; border-left-color: var(--g3); border-bottom-color: var(--g1); animation: ssr 1.35s linear infinite; }
        .r3 { inset: 24px; border: 1.6px dashed var(--g2); animation: ss 3s linear infinite; }
        .core { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #fff 0 5%, var(--g3) 15%, var(--g1) 45%, #050505); box-shadow: 0 0 18px var(--g2); animation: sa 1.05s ease-in-out infinite; overflow: hidden; border: 1.2px solid var(--s2); }
        .core-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; filter: drop-shadow(0 0 8px var(--g2)); animation: imgPulse 1.2s ease-in-out infinite; }
        .stage { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 12px; letter-spacing: 0.9px; color: var(--g2); text-shadow: 0 0 12px var(--g2); }
        .per { font-family: 'Share Tech Mono', monospace; font-size: 8px; color: #fff; margin-top: 3px; font-weight: bold;}
        .bar { width: 115px; height: 6px; border-radius: 999px; border: 1.5px solid var(--g2); margin: 8px auto 0; overflow: hidden; background: rgba(0, 0, 0, 0.95); }
        #spd-bar-fill { display: block; height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #1a1400, var(--g1), var(--g3), var(--g2)); box-shadow: 0 0 12px var(--g2); transition: width 0.12s linear; }

        .res { 
            width: 148px; height: 120px; border-radius: 22px; 
            background: radial-gradient(circle at 50% 25%, rgba(255, 255, 255, 0.18), transparent 22%), radial-gradient(circle, #1a1400, var(--bg-dark) 75%); 
            border: 2px solid var(--g2); box-shadow: 0 0 24px rgba(255, 215, 0, 0.6), inset 0 0 18px rgba(0, 0, 0, 0.95); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            animation: spop 0.5s cubic-bezier(0.15, 1.25, 0.35, 1) forwards; 
            position: relative; overflow: hidden; 
            perspective: 800px;
            transform-style: preserve-3d;
        }

        .res-mesh {
            position: absolute;
            top: 50%; left: 50%;
            border-radius: 22px; 
            pointer-events: none;
            z-index: 1; 
        }
        .m1 { 
            width: 140px; height: 108px; margin-top: -54px; margin-left: -70px;
            border: 2px solid rgba(255, 215, 0, 0.85); box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); 
            animation: rx 5s linear infinite; 
        }
        .m2 { 
            width: 118px; height: 118px; margin-top: -59px; margin-left: -59px;
            border: 2px solid rgba(255, 235, 115, 0.65); box-shadow: 0 0 10px rgba(255, 235, 115, 0.4); 
            animation: ry 6s linear infinite; 
        }
        .m3 { 
            width: 150px; height: 96px; margin-top: -48px; margin-left: -75px;
            border: 2px solid rgba(197, 147, 39, 0.95); box-shadow: 0 0 10px rgba(197, 147, 39, 0.6); 
            animation: rz 7s linear infinite; 
        }

        @keyframes rx { 
            0% { transform: rotateY(35deg) rotateZ(45deg) rotateX(0deg); } 
            100% { transform: rotateY(35deg) rotateZ(45deg) rotateX(360deg); } 
        }
        @keyframes ry { 
            0% { transform: rotateX(45deg) rotateZ(-35deg) rotateY(0deg); } 
            100% { transform: rotateX(45deg) rotateZ(-35deg) rotateY(360deg); } 
        }
        @keyframes rz { 
            0% { transform: rotateX(-40deg) rotateY(30deg) rotateZ(0deg); } 
            100% { transform: rotateX(-40deg) rotateY(30deg) rotateZ(360deg); } 
        }

        .rmain, .rsub { z-index: 5; position: relative; }
        .rmain { margin-top: 0; display: flex; align-items: center; justify-content: center; gap: 9px; }
        .rbs { font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 900; color: #000; letter-spacing: 1.2px; padding: 5px 8px; border-radius: 12px; background: linear-gradient(135deg, var(--g3), var(--g2), var(--g1)); border: 1.5px solid var(--s2); box-shadow: 0 0 14px var(--g2), inset 0 0 10px rgba(255, 255, 255, 0.9); line-height: 1; }
        .rnum-img { width: 32px; height: 32px; object-fit: contain; filter: drop-shadow(0 0 14px var(--g2)); animation: imgPulse 1.2s ease-in-out infinite; }
        .rsub { font-family: 'Share Tech Mono', monospace; margin-top: 6px; font-size: 7px; color: var(--s2); font-weight:bold; text-shadow: 0 0 5px rgba(255, 215, 0, 0.6);}

        .spd-btnrow { position: relative; z-index: 6; display: flex; gap: 7px; margin-top: 9px; height: 30px; }
        button#spd-start { 
            flex: 1.4; height: 30px; border: 1.5px solid var(--g3); border-radius: 14px; color: #000; 
            font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 11px; letter-spacing: 0.8px; 
            background: linear-gradient(135deg, var(--g1), var(--g2), var(--g3), var(--g1)); 
            background-size: 260% 260%; 
            box-shadow: 0 0 14px var(--g2), inset 0 1px 0 rgba(255, 255, 255, 0.8), inset 0 -5px 10px rgba(0, 0, 0, 0.5); 
            animation: sflow 3s linear infinite; cursor: pointer; padding: 0; transition: filter 0.2s; 
        }
        button#spd-hide { 
            flex: 0.8; height: 30px; border-radius: 14px; color: var(--bg-dark); 
            font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 11px; 
            background: linear-gradient(180deg, var(--s2), var(--s1)); border: 1.5px solid #fff; 
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.5); cursor: pointer; padding: 0; 
        }
        button#spd-start:active, button#spd-hide:active { transform: scale(0.95); }
        button#spd-start:disabled { filter: grayscale(1); opacity: 0.7; cursor: not-allowed; }
    </style>
</head>

        "https://i.ibb.co/bjDSynRD/num0-1-removebg-preview.png",
        "https://i.ibb.co/6RKTP2Vb/num0-2-removebg-preview.png",
        "https://i.ibb.co/qYRnjb3F/num0-3-removebg-preview.png",
        "https://i.ibb.co/zhFk8bBf/num0-4-removebg-preview.png",
        "https://i.ibb.co/8DZv6wTn/num0-5-removebg-preview.png",
        "https://i.ibb.co/v69Y349y/num0-6-removebg-preview.png",
        "https://i.ibb.co/hJKVjzdK/num0-7-removebg-preview.png",
        "https://i.ibb.co/bjz1qcmR/num0-8-removebg-preview.png",
        "https://i.ibb.co/z1KYzds/num0-9-removebg-preview.png",
        "https://i.ibb.co/84BRwGPK/num0-10-removebg-preview.png",
    ];

    function getPeriodCode() {
        let d = new Date();
        d.setMinutes(d.getMinutes() - 1);
        let utc = new Date(d.getTime() + (d.getTimezoneOffset() * 60000));
        let y = utc.getFullYear();
        let m = String(utc.getMonth() + 1).padStart(2,'0');
        let dt = String(utc.getDate()).padStart(2,'0');
        let totalMins = (utc.getHours() * 60) + utc.getMinutes();
        return y + m + dt + String(10001 + totalMins);
    }

    function setBtn(text, fn) {
        startBtn.innerText = text;
        startBtn.onclick = fn;
        startBtn.disabled = !fn;
    }

    async function fetchLastResult() {
        try {
            const response = await fetch(API_URL, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            });
            const data = await response.json();
            if (data && data.data && data.data.list && data.data.list.length > 0) {
                const latest = data.data.list[0];
                const num = parseInt(latest.number, 10);
                const bs = num <= 4 ? "SMALL" : "BIG";

                lastApiResult = {
                    period: latest.issueNumber.slice(-4),
                    fullPeriod: latest.issueNumber,
                    num: num,
                    bs: bs
                };
                return true;
            }
            return false;
        } catch (err) {
            console.error("API Fetch Error:", err);
            return false;
        }
    }

    function showApiResult() {
        if (!lastApiResult) return;
        let img = SPD_NUM_IMGS[lastApiResult.num] || SPD_NUM_IMGS[0];
        ui.innerHTML = `
            <div class="res">
                <div class="res-mesh m1"></div>
                <div class="res-mesh m2"></div>
                <div class="res-mesh m3"></div>
                <div class="rmain">
                    <span class="rbs">${lastApiResult.bs}</span>
                    <img class="rnum-img" src="${img}">
                </div>
                <div class="rsub">PERIOD ${lastApiResult.period}</div>
            </div>`;
        setBtn("REFRESH", runFetchFlow);
    }

    async function runFetchFlow() {
        if(isWorking) return;
        isWorking = true;
        let p = 0;

        ui.innerHTML = `
            <div class="spd-loader">
                <div class="spd-spinner">
                    <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
                    <div class="core"><img class="core-img" src="${SPD_CORE_IMG}"></div>
                </div>
                <div class="stage" id="spd-stage">FETCHING</div>
                <div class="per" id="spd-percent">0%</div>
                <div class="bar"><i id="spd-bar-fill"></i></div>
            </div>`;

        setBtn("WAIT", null);
        if(window.TeamBridge) TeamBridge.playSound('scan_start.mp3');

        let stages = ["CONNECTING", "FETCHING API", "DECODING", "READY"];
        let timer = setInterval(() => {
            p += Math.random() * 10 + 6;
            if(p >= 100) p = 100;

            document.getElementById("spd-bar-fill").style.width = Math.floor(p) + "%";
            document.getElementById("spd-percent").innerText = Math.floor(p) + "%";
            document.getElementById("spd-stage").innerText = stages[Math.min(stages.length - 1, Math.floor(p / 26))];

            if(p >= 100) {
                clearInterval(timer);
                setTimeout(async () => {
                    const success = await fetchLastResult();
                    if (success) {
                        showApiResult();
                        if(window.TeamBridge) {
                            try {
                                TeamBridge.playSound('hack_success.mp3');
                                TeamBridge.speak(lastApiResult.bs + " " + lastApiResult.num);
                            } catch(e) {}
                        }
                    } else {
                        ui.innerHTML = `
                            <div class="box">
                                <div class="mark"><img class="mark-img" src="${SPD_MARK_IMG}"></div>
                                <div class="btitle">ERROR</div>
                                <div class="bsub">API FAILED</div>
                                <div class="bnote">CHECK CONNECTION</div>
                            </div>`;
                        setBtn("RETRY", runFetchFlow);
                    }
                    isWorking = false;
                }, 300);
            }
        }, 100);
    }

    function renderPanel() {
        let currentPeriod = getPeriodCode();

        let newPboxText = 'PERIOD: <b style="color:#fff">' + currentPeriod.slice(-4) + '</b>';
        if (pbox.innerHTML !== newPboxText) {
            pbox.innerHTML = newPboxText;
        }

        live.innerHTML = "● LIVE";

        let mode = lastApiResult ? 'result' : 'ready';
        let signature = mode + "|" + currentPeriod + "|" + (lastApiResult ? lastApiResult.fullPeriod : 'none');

        if (signature === lastRenderedSignature) return;
        lastRenderedSignature = signature;

        if (mode === 'result') {
            showApiResult();
        } else if (mode === 'ready') {
            if (!isWorking) {
                ui.innerHTML = `
                    <div class="box">
                        <div class="mark"><img class="mark-img" src="${SPD_MARK_IMG}"></div>
                        <div class="btitle">MIZAN MOD</div>
                        <div class="bsub">READY</div>
                        <div class="bnote">TAP START FOR RESULT</div>
                    </div>`;
                setBtn("START", runFetchFlow);
            }
        }
    }

    setInterval(() => {
        if (isWorking) return;
        renderPanel();
    }, 400);

    function autoFetch() {
        if (!autoScanned && opened && !isWorking && !lastApiResult) {
            autoScanned = true;
            runFetchFlow();
        }
    }

    function makeDraggable(el, clickCallback) {
        let sx = 0, sy = 0, ox = 0, oy = 0;
        let isDragging = false;
        let hasMoved = false;

        function touchStart(e) {
            if (e.target.tagName.toLowerCase() === 'button' || e.target.closest('button')) return;
            let p = e.touches ? e.touches[0] : e;
            sx = p.clientX; sy = p.clientY;

            let rect = el.getBoundingClientRect();
            ox = rect.left;
            oy = rect.top;

            isDragging = true;
            hasMoved = false;
            el.style.transition = 'none';
            el.style.cursor = 'grabbing';
        }

        function touchMove(e) {
            if (!isDragging) return;
            let p = e.touches ? e.touches[0] : e;
            let dx = p.clientX - sx;
            let dy = p.clientY - sy;
            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) hasMoved = true;

            let nx = Math.max(0, Math.min(window.innerWidth - el.offsetWidth, ox + dx));
            let ny = Math.max(0, Math.min(window.innerHeight - el.offsetHeight, oy + dy));

            el.style.left = nx + 'px';
            el.style.top = ny + 'px';
            if (e.cancelable) e.preventDefault();
        }

        function touchEnd(e) {
            if (!isDragging) return;
            isDragging = false;
            el.style.cursor = 'grab';
            el.style.transition = "left 0.15s ease-out, top 0.15s ease-out";

            if (!hasMoved && typeof clickCallback === 'function') {
                clickCallback();
            }

            setTimeout(() => { el.style.transition = ''; }, 200);
        }

        el.addEventListener("touchstart", touchStart, { passive: false });
        document.addEventListener("touchmove", touchMove, { passive: false });
        document.addEventListener("touchend", touchEnd, { passive: false });
        el.addEventListener("mousedown", touchStart, false);
        document.addEventListener("mousemove", touchMove, false);
        document.addEventListener("mouseup", touchEnd, false);
    }

    function openCard() {
        if (opened) return;
        opened = true;

        mini.style.display = 'none';

        stage.style.display = 'block';
        stage.classList.remove('spd-close');
        stage.classList.add('spd-open');

        renderPanel();
        setTimeout(autoFetch, 500);
    }

    function closeCard() {
        if (!opened) return;
        opened = false;

        stage.classList.remove('spd-open');
        stage.classList.add('spd-close');

        mini.style.display = 'flex';

        setTimeout(() => {
            if (!opened) {
                stage.style.display = 'none';
                stage.classList.remove('spd-close');
            }
        }, 250);
    }

    hideBtn.onclick = closeCard;
    makeDraggable(mini, openCard);
    makeDraggable(stage, null);

    ui.innerHTML = `
        <div class="box">
            <div class="mark"><img class="mark-img" src="${SPD_MARK_IMG}"></div>
            <div class="btitle">MIZAN MOD</div>
            <div class="bsub">READY</div>
            <div class="bnote">TAP START FOR RESULT</div>
        </div>`;
    setBtn("START", runFetchFlow);
</script>

</body></html>
